spark.master            local[2]
spark.driver.memory     2g
spark.jars.packages     org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.1,org.apache.iceberg:iceberg-aws-bundle:1.10.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9,org.apache.hadoop:hadoop-aws:3.3.4
spark.sql.catalog.gridflow                          org.apache.iceberg.spark.SparkCatalog
